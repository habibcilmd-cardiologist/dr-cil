<div id="search-wrapper"
  class="fixed inset-0 flex h-screen w-screen cursor-default flex-col bg-neutral-500/50 p-4 backdrop-blur-sm dark:bg-neutral-900/50 sm:p-6 md:p-[10vh] lg:p-[12vh] z-500"
  data-url="{{ "" | relLangURL }}"
  data-loading="{{ i18n "ui_search_loading" }}" data-error="{{ i18n "ui_search_error" }}"
  data-empty="{{ i18n "ui_search_empty" }}" data-count="{{ i18n "ui_search_count" }}" hidden>
  <div id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-title" tabindex="-1"
    class="flex flex-col w-full max-w-3xl min-h-0 mx-auto border rounded-md shadow-lg border-neutral-200 bg-neutral dark:border-neutral-700 dark:bg-neutral-800">
    <h2 id="search-title" class="sr-only">{{ i18n "ui_search_title" }}</h2>
    <header class="relative z-10 flex items-center justify-between flex-none px-2">
      <form role="search" class="flex items-center flex-auto min-w-0">
        <div class="flex items-center justify-center w-8 h-8 text-neutral-400" aria-hidden="true">{{ partial "icon.html" "search" }}</div>
        <label for="search-query" class="sr-only">{{ i18n "ui_search_label" }}</label>
        <input type="search" id="search-query" autocomplete="off"
          class="flex flex-auto min-w-0 h-12 mx-1 bg-transparent appearance-none"
          placeholder="{{ i18n "search.input_placeholder" }}" aria-controls="search-results">
      </form>
      <button id="close-search-button" type="button" class="drcil-icon-button text-neutral-700 dark:text-neutral"
        aria-label="{{ i18n "ui_search_close" }}" title="{{ i18n "ui_search_close" }}">{{ partial "icon.html" "xmark" }}</button>
    </header>
    <p id="search-status" role="status" aria-live="polite" aria-atomic="true" class="px-3 py-2 text-sm"></p>
    <section class="flex-auto px-2 overflow-auto" aria-label="{{ i18n "ui_search_results" }}">
      <ul id="search-results" aria-busy="false"></ul>
    </section>
  </div>
</div>
