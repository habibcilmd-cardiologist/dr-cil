          - listitem [ref=f4e435]:
            - link "علاج انسداد الشرايين تحت الركبة - الشريان تحت المأبضي الخدمات · 15 يناير 2024 تم إعداد هذا المحتوى وفقاً للوائح وزارة الصحة التركية وقواعد الأخلاقيات الطبية، بهدف حماية الصحة العامة وتوفير المعلومات. لا يتضمن أي تشخيص أو ضمان للعلاج أو إحالة. يرجى استشارة مرفق رعاية صحية معتمد للحصول على أدق المعلومات. انسداد الشرايين تحت الركبة (مرض الشريان تحت المأبضي) هو تضيق أو انسداد الشرايين الظنبوبية تحت الركبة بسبب تصلب الشرايين. وهو شائع بشكل خاص في مرضى السكري وهو أحد أهم أسباب نقص التروية الحرج للأطراف. يتمتع أخصائي أمراض القلب الأستاذ المشارك الدكتور حبيب تشيل بخبرة متخصصة في العلاج التداخلي لأمراض الأوعية تحت الركبة." [ref=f4e436] [cursor=pointer]:
              - /url: http://127.0.0.1:1314/ar/services/below-knee-arterial-disease/
              - generic [ref=f4e437]: علاج انسداد الشرايين تحت الركبة - الشريان تحت المأبضي
              - generic [ref=f4e438]: الخدمات · 15 يناير 2024
              - generic [ref=f4e439]: تم إعداد هذا المحتوى وفقاً للوائح وزارة الصحة التركية وقواعد الأخلاقيات الطبية، بهدف حماية الصحة العامة وتوفير المعلومات. لا يتضمن أي تشخيص أو ضمان للعلاج أو إحالة. يرجى استشارة مرفق رعاية صحية معتمد للحصول على أدق المعلومات. انسداد الشرايين تحت الركبة (مرض الشريان تحت المأبضي) هو تضيق أو انسداد الشرايين الظنبوبية تحت الركبة بسبب تصلب الشرايين. وهو شائع بشكل خاص في مرضى السكري وهو أحد أهم أسباب نقص التروية الحرج للأطراف. يتمتع أخصائي أمراض القلب الأستاذ المشارك الدكتور حبيب تشيل بخبرة متخصصة في العلاج التداخلي لأمراض الأوعية تحت الركبة.
          - listitem [ref=f4e440]:
            - 'link "استئصال العصيدة الطرفية والتاجية - إجراء إزالة اللويحات الوعائية الخدمات · 15 يناير 2024 تم إعداد هذا المحتوى لأغراض الصحة العامة والتوعية. لا يتضمن أي تشخيص أو ضمان للعلاج أو توصية. للحصول على المعلومات الأكثر دقة، يرجى استشارة مؤسسة صحية معتمدة. استئصال العصيدة هو إجراء لإزالة اللويحات التصلبية ميكانيكيًا من داخل الأوعية الدموية. هذه الطريقة، المستخدمة خاصة في الآفات المتكلسة وعندما يكون رأب الأوعية بالبالون القياسي غير كافٍ، يمكن تطبيقها في كل من الشرايين التاجية والطرفية. يغطي هذا الدليل الشامل أنواع استئصال العصيدة ودواعي الاستخدام وخطوات الإجراء والنتائج. ما هو استئصال العصيدة؟ # استئصال العصيدة هو الإزالة الفيزيائية للويحات التصلبية من جدار الوعاء باستخدام أجهزة متخصصة في طرف القسطرة. يمكن إزالة اللويحات من خلال القطع أو الكشط أو الطحن أو التبخير. يكمل هذا الإجراء ويحضر الوعاء لرأب الأوعية بالبالون والدعامة بدلاً من أن يكون بديلاً." [ref=f4e441] [cursor=pointer]':
              - /url: http://127.0.0.1:1314/ar/services/atherectomy/
              - generic [ref=f4e442]: استئصال العصيدة الطرفية والتاجية - إجراء إزالة اللويحات الوعائية
              - generic [ref=f4e443]: الخدمات · 15 يناير 2024
              - generic [ref=f4e444]: "تم إعداد هذا المحتوى لأغراض الصحة العامة والتوعية. لا يتضمن أي تشخيص أو ضمان للعلاج أو توصية. للحصول على المعلومات الأكثر دقة، يرجى استشارة مؤسسة صحية معتمدة. استئصال العصيدة هو إجراء لإزالة اللويحات التصلبية ميكانيكيًا من داخل الأوعية الدموية. هذه الطريقة، المستخدمة خاصة في الآفات المتكلسة وعندما يكون رأب الأوعية بالبالون القياسي غير كافٍ، يمكن تطبيقها في كل من الشرايين التاجية والطرفية. يغطي هذا الدليل الشامل أنواع استئصال العصيدة ودواعي الاستخدام وخطوات الإجراء والنتائج. ما هو استئصال العصيدة؟ # استئصال العصيدة هو الإزالة الفيزيائية للويحات التصلبية من جدار الوعاء باستخدام أجهزة متخصصة في طرف القسطرة. يمكن إزالة اللويحات من خلال القطع أو الكشط أو الطحن أو التبخير. يكمل هذا الإجراء ويحضر الوعاء لرأب الأوعية بالبالون والدعامة بدلاً من أن يكون بديلاً."