              - generic [ref=f4e427]: ما هي القدم السكرية؟ الأعراض والعلاج وطرق الوقاية
              - generic [ref=f4e428]: المدونة · 17 ديسمبر 2025
              - generic [ref=f4e429]: "تم إعداد هذا المحتوى بما يتوافق مع تشريعات وزارة الصحة في الجمهورية التركية والقواعد الأخلاقية الطبية، بهدف حماية الصحة العامة وتوفير المعلومات. لا يتضمن أي تشخيص أو ضمان للعلاج أو توجيه طبي. يرجى استشارة مؤسسة صحية معتمدة للحصول على المعلومات الأكثر دقة. القدم السكرية هي مضاعفات خطيرة تتطور في مرضى السكري وتؤثر على القدمين. هذه الحالة، الناتجة عن الجمع بين تلف الأعصاب (الاعتلال العصبي) وأمراض الأوعية الدموية (اعتلال الأوعية الدموية)، تزيد بشكل كبير من خطر تكوين الجروح والعدوى والبتر. لكن الخبر السار هو أن الغالبية العظمى من مضاعفات القدم السكرية يمكن الوقاية منها! في هذا الدليل الشامل، سأناقش بالتفصيل ما هي القدم السكرية، وعوامل الخطر، والأعراض، وطرق العلاج، والأهم من ذلك، كيف يمكن الوقاية منها. ما هي القدم السكرية؟ # تصف القدم السكرية سلسلة من المضاعفات التي تؤثر على القدمين في مرضى السكري. يؤدي ارتفاع سكر الدم لفترة طويلة إلى مشكلتين رئيسيتين في الجسم:"
          - listitem [ref=f4e430]:
            - link "تصوير الأوعية المحيطية - تصوير أوعية الأطراف الخدمات · 15 يناير 2024 تم إعداد هذا المحتوى وفقاً للوائح وزارة الصحة في جمهورية تركيا وقواعد الأخلاق الطبية، بهدف حماية الصحة العامة وإعلامها. لا يحتوي على أي تشخيص أو ضمان علاج أو إحالة. يرجى استشارة مرفق صحي معتمد للحصول على أدق المعلومات. تصوير الأوعية المحيطية هو تصوير الأوعية خارج القلب (الشرايين والأوردة) باستخدام الأشعة السينية وصبغة التباين. يستخدم هذا الإجراء لتشخيص مرض الشرايين المحيطية والأمراض الوريدية والتشوهات الوعائية. يتمتع أخصائي أمراض القلب التداخلية أ.م.د. حبيب جيل بخبرة واسعة في إجراءات تصوير الأوعية المحيطية." [ref=f4e431] [cursor=pointer]:
