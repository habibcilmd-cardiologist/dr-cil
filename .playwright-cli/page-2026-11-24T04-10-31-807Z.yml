            - link "Below-Knee Arterial Occlusion Treatment - Infrapopliteal Artery Services · January 15, 2024 This content has been prepared in accordance with the Republic of Turkey Ministry of Health regulations and medical ethics rules, for the purpose of protecting public health and providing information. It does not contain any diagnosis, treatment guarantee, or referral. Please consult an authorized healthcare facility for the most accurate information. Below-knee arterial occlusion (infrapopliteal artery disease) is the narrowing or blockage of the tibial arteries below the knee due to atherosclerosis. It is particularly common in diabetic patients and is one of the most important causes of critical limb ischemia." [ref=f3e480] [cursor=pointer]:
