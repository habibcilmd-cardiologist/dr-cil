        - text: "{\"@context\":\"https://schema.org\",\"@graph\":[{\"@id\":\"https://docdrhabibcil.com/#website\",\"@type\":\"WebSite\",\"inLanguage\":[\"tr\",\"en\",\"ar\"],\"name\":\"Doç. Dr. Habib ÇİL | İstanbul Kardiyoloji Uzmanı\",\"publisher\":{\"@id\":\"https://docdrhabibcil.com/#physician\"},\"url\":\"https://docdrhabibcil.com/\"},{\"@id\":\"https://docdrhabibcil.com/#physician\",\"@type\":\"Person\",\"image\":\"https://docdrhabibcil.com/img/istanbul-kardiyoloji-uzmani-doc-dr-habib-cil_hu_35be8d9035c8d4e6.webp\",\"jobTitle\":\"Girişimsel Kardiyoloji Uzmanı\",\"name\":\"Doç. Dr. Habib ÇİL\",\"url\":\"https://docdrhabibcil.com/hakkimda/\"},{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#breadcrumb\",\"@type\":\"BreadcrumbList\",\"itemListElement\":[{\"@type\":\"ListItem\",\"item\":\"https://docdrhabibcil.com/\",\"name\":\"Ana Sayfa\",\"position\":1},{\"@type\":\"ListItem\",\"item\":\"https://docdrhabibcil.com/blog/\",\"name\":\"Blog\",\"position\":2},{\"@type\":\"ListItem\",\"item\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/\",\"name\":\"Diyabetik Ayak Nedir? Belirtileri, Tedavisi ve Korunma Yöntemleri\",\"position\":3}]},{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#article\",\"@type\":\"BlogPosting\",\"author\":{\"@id\":\"https://docdrhabibcil.com/#physician\"},\"dateModified\":\"2026-11-24T00:00:00+00:00\",\"datePublished\":\"2025-12-17T00:00:00+00:00\",\"description\":\"Diyabetik ayak belirtileri, ayak bakımı ve tedavi yaklaşımları hakkında rehber. Yara bakımı, enfeksiyon, damar değerlendirmesi ve ilgili hizmet sayfaları.\",\"headline\":\"Diyabetik Ayak Nedir? Belirtileri, Tedavisi ve Korunma Yöntemleri\",\"image\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/featured.svg\",\"inLanguage\":\"tr\",\"isPartOf\":{\"@id\":\"https://docdrhabibcil.com/#website\"},\"mainEntityOfPage\":{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#webpage\"},\"publisher\":{\"@id\":\"https://docdrhabibcil.com/#physician\"},\"url\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/\",\"wordCount\":3353},{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#webpage\",\"@type\":\"MedicalWebPage\",\"breadcrumb\":{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#breadcrumb\"},\"description\":\"Diyabetik ayak belirtileri, ayak bakımı ve tedavi yaklaşımları hakkında rehber. Yara bakımı, enfeksiyon, damar değerlendirmesi ve ilgili hizmet sayfaları.\",\"inLanguage\":\"tr\",\"isPartOf\":{\"@id\":\"https://docdrhabibcil.com/#website\"},\"mainEntity\":{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#article\"},\"name\":\"Diyabetik Ayak Nedir? Belirtileri, Tedavisi ve Korunma Yöntemleri\",\"publisher\":{\"@id\":\"https://docdrhabibcil.com/#physician\"},\"url\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/\"},{\"@id\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/#faq\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Diyabetik ayak erken dönemde yakalanır ve uygun tedavi edilirse tamamen iyileşebilir. Ancak ilerlemiş vakalarda tam iyileşme zor olabilir. En önemli nokta, kan şekeri kontrolü, düzenli ayak bakımı ve erken müdahale ile komplikasyonların önlenmesidir. Tedavi süreci hastanın genel durumuna, yaranın derinliğine ve enfeksiyon varlığına göre değişir.\"},\"name\":\"Diyabetik ayak tamamen iyileşir mi?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Diyabetik ayaklarda sinir hasarı nedeniyle ağrı hissi azalmış olabilir, bu nedenle yaralar fark edilmeyebilir. Ayaklarınızı her gün kontrol edin: kızarıklık, şişlik, sıcaklık artışı, renk değişikliği, nasır, su toplaması, kesik veya çatlaklar için. Ayna kullanarak ayak tabanınızı da kontrol edin. Herhangi bir değişiklik fark ederseniz hemen doktorunuza başvurun.\"},\"name\":\"Diyabetik ayak yarasını nasıl fark ederim?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yumuşak, esnek ve geniş burunlu ayakkabılar tercih edin. Ayakkabılar ayağınızı sıkmamalı, sürtmemeli ve basınç noktası oluşturmamalıdır. Deri veya nefes alabilen malzemelerden yapılmış ayakkabılar idealdir. Yüksek topuklu, dar burunlu veya sert ayakkabılardan kaçının. Yeni ayakkabıları kademeli olarak giyin. Özel diyabetik ayakkabılar veya ortopedik tabanlar gerekebilir.\"},\"name\":\"Diyabetik ayakta hangi ayakkabıları giymeliyim?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Diyabet hem sinir hasarına (nöropati) hem de damar hasarına (vaskülopati) neden olur. Sinir hasarı ağrı hissini azaltır, küçük yaralanmalar fark edilmez. Damar hasarı ise yara iyileşmesini bozar ve enfeksiyon riskini artırır. Bu iki faktörün birleşimi, küçük bir yaranın bile ciddi enfeksiyona, gangrene ve ampütasyona yol açabilmesine neden olur. Düzenli ayak bakımı bu riskleri önemli ölçüde azaltır.\"},\"name\":\"Diyabette ayak bakımı neden bu kadar önemli?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Diyabetik ayak enfeksiyonları çok ciddi olabilir ve hızla ilerleyebilir. Enfeksiyon kemiğe yayılabilir (osteomiyelit), kan dolaşımına girebilir (sepsis) ve hayatı tehdit edebilir. Diyabetik ayak enfeksiyonları, diyabetik olmayan hastalara göre daha ağır seyreder ve tedavisi daha zordur. Erken tanı ve agresif tedavi hayati önem taşır. Ateş, titreme, yarada kötü koku, artan kızarıklık ve şişlik gibi belirtiler acil müdahale gerektirir.\"},\"name\":\"Diyabetik ayak enfeksiyonu ne kadar ciddidir?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"İyi kan şekeri kontrolü diyabetik ayak komplikasyonlarını önlemede en kritik faktördür. Yüksek kan şekeri sinir hasarını hızlandırır, bağışıklık sistemini zayıflatır, yara iyileşmesini bozar ve enfeksiyon riskini artırır. HbA1c değerinin %7’nin altında tutulması hedeflenmelidir. Düzenli kan şekeri takibi, ilaç uyumu ve yaşam tarzı değişiklikleri ile iyi kontrol sağlanabilir.\"},\"name\":\"Kan şekeri kontrolü ayak sağlığını nasıl etkiler?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Diyabet, travmatik olmayan alt ekstremite ampütasyonlarının en sık nedenidir. Ancak ampütasyonların %85’i önlenebilir! Erken tanı, düzenli ayak muayeneleri, uygun ayak bakımı, iyi kan şekeri kontrolü ve risk faktörlerinin yönetimi ile ampütasyon riski önemli ölçüde azaltılabilir. Yara geliştiğinde erken ve agresif tedavi kritik öneme sahiptir.\"},\"name\":\"Diyabetik ayakta ampütasyon riski nedir?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Risk düzeyinize göre kontrol sıklığı değişir. Düşük riskli hastalarda yılda en az bir kez, orta riskli hastalarda 3-6 ayda bir, yüksek riskli hastalarda (önceden yara veya ampütasyon öyküsü) 1-3 ayda bir kontrol önerilir. Aktif yara varsa daha sık takip gerekir. Herhangi bir değişiklik, yara veya enfeksiyon belirtisi fark ederseniz hemen doktorunuza başvurun.\"},\"name\":\"Diyabetik ayak için ne sıklıkla doktor kontrolüne gitmeliyim?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Sigara damar hasarını ciddi şekilde artırır, kan akışını azaltır ve yara iyileşmesini bozar. Sigara içen diyabet hastalarında ampütasyon riski 2-3 kat daha yüksektir. Sigara ayrıca enfeksiyon riskini artırır ve tedaviye yanıtı azaltır. Diyabetik ayak riski olan hastalarda sigarayı bırakmak mutlaka gereklidir. Sigarayı bırakmak için destek programları ve ilaç tedavileri mevcuttur.\"},\"name\":\"Diyabetik ayakta sigara kullanımı neden tehlikelidir?\"},{\"@type\":\"Question\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Ayaklarınızı her gün ılık suyla yıkayın (sıcak değil!), nazikçe kurulayın, özellikle parmak aralarını. Nemlendirici krem sürün ama parmak aralarına değil. Tırnaklarınızı düz kesin, köşeleri yuvarlamayın. Kalın çoraplar giyin, dikişsiz olanları tercih edin. Çıplak ayakla yürümeyin. Her gün ayaklarınızı kontrol edin. Nasırları kendiniz kesmemeye çalışmayın, profesyonel yardım alın.\"},\"name\":\"Diyabetik ayakta evde nasıl bakım yapmalıyım?\"}],\"name\":\"Diyabetik Ayak Nedir? Belirtileri, Tedavisi ve Korunma Yöntemleri — Sık Sorulan Sorular\",\"url\":\"https://docdrhabibcil.com/blog/diyabetik-ayak/\"}]}"
